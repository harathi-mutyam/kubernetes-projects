# =========================================================
#  vProfile Ingress Controller (External Access Layer)
# =========================================================
# Purpose:
# - Exposes vProfile application to the internet
# - Uses NGINX Ingress Controller
# - Routes traffic from domain to backend service
# - Supports path-based routing (/)
# =========================================================
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: vpro-ingress
  annotations:
    nginx.ingress.kubernetes.io/use-regex: "true"
spec:
  ingressClassName: nginx
  rules:
  - host: vprofile.ehmutyam.xyz   #replace with your project.domainname.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: vproapp-service
            port:
              number: 8080
