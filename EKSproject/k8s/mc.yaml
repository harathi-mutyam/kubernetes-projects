# =========================================================
#  vProfile Memcached Deployment (Caching Layer)
# =========================================================
# Purpose:
# - Provides in-memory caching for vProfile application
# - Reduces database load
# - Improves application performance and response time
# =========================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vpromc
  labels:
    app: vpromc
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vpromc
  template:
    metadata:
      labels:
        app: vpromc
    spec:
      containers:
      - name: vpromc
        image: memcached
        ports:
        - name: vpromc-port
          containerPort: 11211

---
# =========================================================
#  Memcached Internal Service (ClusterIP)
# =========================================================
# Purpose:
# - Exposes Memcached within Kubernetes cluster only
# - Used by vProfile application for caching
# =========================================================
apiVersion: v1
kind: Service
metadata:
  name: vprocache01
spec:
  ports:
  - port: 11211
    targetPort: vpromc-port
    protocol: TCP
  selector:
    app: vpromc
  type: ClusterIP
